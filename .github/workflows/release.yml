name: Release Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - name: 从 Secrets 准备签名目录
        shell: pwsh
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_CREDENTIALS_TXT: ${{ secrets.SIGNING_CREDENTIALS_TXT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEYSTORE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CREDENTIALS_TXT)) {
            Write-Output "未配置签名 Secrets（SIGNING_KEYSTORE_BASE64 / SIGNING_CREDENTIALS_TXT），本次跳过发布构建"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $dir 'release.keystore'),
            [Convert]::FromBase64String($env:SIGNING_KEYSTORE_BASE64))
          $credentials = $env:SIGNING_CREDENTIALS_TXT.TrimEnd() + [Environment]::NewLine
          [IO.File]::WriteAllText(
            (Join-Path $dir '签名凭据.txt'),
            $credentials,
            [Text.UTF8Encoding]::new($false))
          "SIGNING_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 正式签名提交构建
        if: env.SIGNING_DIR != ''
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)\+([1-9]\d*)\s*$' | Select-Object -First 1
          if (-not $versionLine) { throw 'pubspec.yaml 缺少有效版本号' }
          $versionName = $versionLine.Matches[0].Groups[1].Value
          $versionCode = [int]$versionLine.Matches[0].Groups[2].Value
          pwsh -NoProfile -File Tools\Build-Android.ps1 `
            -VersionName $versionName `
            -VersionCode $versionCode `
            -SigningDirectory "$env:SIGNING_DIR"
      - name: 上传到每次提交对应的 Release
        if: env.SIGNING_DIR != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          $shortSha = '${{ github.sha }}'.Substring(0, 8)
          $tag = "build-$timestamp-$shortSha"
          $apk = Get-ChildItem dist/android/PackingProof-Mobile-*.apk -File | Select-Object -Single
          $manifest = Get-Item dist/android/build-manifest.json
          $notes = @"
          自动构建提交：${{ github.sha }}

          编译时间（UTC）：$timestamp

          APK 内含 Git revision 与编译时间元数据，可直接覆盖安装
          "@
          gh release create $tag `
            $apk.FullName `
            $manifest.FullName `
            --target '${{ github.sha }}' `
            --title "$tag 自动提交构建" `
            --notes $notes
